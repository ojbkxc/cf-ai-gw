# cf-ai-gw — 账号二部署配置（参照 wrangler.toml 即账号一）
# 账号二：Fiyou@dubooks.tk's Account
#   account_id      = 2169eb5035227e0a7a3f6e6a4887fe99
#   KV namespace    = cf-ai-gw (id=58933b8e555746c2b8b4451c187e3189, 本配置创建)
#   workers.dev     = fiyou-216.cf-ai-gw.workers.dev（subdomain=fiyou-216）
#   zone            = wei.de5.net（可挂自定义域，需在 Dashboard 加 route）
#
# 部署命令（API Token 只经环境变量 CLOUDFLARE_API_TOKEN 传入，严禁写入文件）：
#   npx wrangler deploy --config wrangler.account2.toml
#
# 模式 A（推荐）：main = "src/index.js" → 需 AI Binding（本配置已声明，wrangler 会自动绑）
# 模式 B（多账号 failover）：main = "_worker.js" → 无需 AI Binding，在 /admin 面板加账号

name = "cf-ai-gw"
main = "src/index.js"
compatibility_date = "2025-08-01"
account_id = "2169eb5035227e0a7a3f6e6a4887fe99"

# 管理密码（与账号一保持一致，明文 var）
[vars]
ADMIN_PASSWORD = "mzyxc8520#"
# 账号二无 ojbkxc AI Gateway，关闭网关挂载（否则 env.AI.run 第 3 参 gateway.id 命中不存在的网关 → 上游 500）
AI_GATEWAY_ID = "off"

# KV 绑定：账号二新建的 cf-ai-gw 命名空间
[[kv_namespaces]]
binding = "KV"
id = "58933b8e555746c2b8b4451c187e3189"

# Workers AI 绑定（模式 A：单账号，内部 RPC 调用）
[ai]
binding = "AI"