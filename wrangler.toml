# cf-ai-gw — Cloudflare Worker 部署配置
# 将 Cloudflare Workers AI 转成 OpenAI / Anthropic 兼容 API，单账号 AI Binding 直连。

name = "cf-ai-gw"
main = "src/index.js"
compatibility_date = "2025-08-01"

# === Workers AI 绑定 ===
[ai]
binding = "AI"

# === KV 命名空间绑定 ===
[[kv_namespaces]]
binding = "KV"
id = "YOUR_KV_NAMESPACE_ID"

# === 环境变量 ===
[vars]
ADMIN_PASSWORD = "YOUR_ADMIN_PASSWORD"
# 可选覆盖：
# DAILY_LIMIT = 10000
# MONTHLY_LIMIT = 100000
# USAGE_THRESHOLD = 0
# OVERSIZE_TOKENS = 200000
# CB_WINDOW_MS = 10000
# CB_FAIL_THRESHOLD = 8
# CB_COOLDOWN_MS = 4000
# MODEL_DOWN_FAILS = 3
# MODEL_DOWN_AFTER_MS = 60000