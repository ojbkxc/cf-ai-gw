# cf-ai-gw — Cloudflare Worker 部署配置
# 将 Cloudflare Workers AI 转成 OpenAI / Anthropic 兼容 API。
#
# 支持两种部署模式，按需切换 main 字段即可：
#   模式 A（推荐，规避检查）：main = "src/index.js"  → Dashboard 需添加 AI Binding
#   模式 B（多账号 failover）：main = "_worker.js"    → Dashboard 无需 AI Binding
#
# 默认采用模式 A（Worker + AI Binding，单账号首选）。

name = "Binding"
main = "src/index.js"
compatibility_date = "2025-08-01"

# KV 绑定：存储配置、API Key、用量统计等
[[kv_namespaces]]
binding = "KV"
id = "f2d6dfb3f9034d4b86c46740f813c634"

# Workers AI 绑定（模式 A：单账号，内部 RPC 调用）
[ai]
binding = "AI"
