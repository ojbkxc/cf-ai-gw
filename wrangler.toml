# cf-ai-gw — Cloudflare Worker 部署配置
# 将 Cloudflare Workers AI 转成 OpenAI / Anthropic 兼容 API。
#
# 支持两种部署模式，按需切换 main 字段即可：
#   模式 A（推荐，规避检查）：main = "src/index.js"  → Dashboard 需添加 AI Binding
#   模式 B（多账号 failover）：main = "_worker.js"    → Dashboard 无需 AI Binding
#
# 默认采用模式 A（Worker + AI Binding，单账号首选）。

name = "cf-ai-gw"
main = "src/index.js"
compatibility_date = "2025-08-01"
account_id = "cc4b64888d2bb80770ff42b0e3c1fad2"


# 管理密码（用户要求明文 var，不用 secret）
[vars]
ADMIN_PASSWORD = "mzyxc8520#"
# 可选：开启真实 Neurons 用量看板（仅部署模式 A 且未在面板配置 cfg_accounts 时生效）
# 需注入一个"仅含 Account > Workers Analytics > Read 权限"的 API Token（最小权限，泄露只能读 Analytics）
# 配置方式：
#   wrangler secret put ANALYTICS_API_TOKEN   # 粘贴只读 Token
#   在本 [vars] 填 ANALYTICS_ACCOUNT_ID（即下方 account_id，明文无敏感）
# 不配置则看板走本地 token 兜底（开箱即用，但口径是 Token 不是 Neurons）
# ANALYTICS_ACCOUNT_ID = "cc4b64888d2bb80770ff42b0e3c1fad2"

# KV 绑定：存储配置、API Key、用量统计等
[[kv_namespaces]]
binding = "KV"
id = "692bd958d51b4890a02b5fe637cddae2"

# Durable Object：API 密钥的强一致已用次数计数（原子检查+递增，杜绝限次数超卖）
# 每把 key 对应一个命名的 DO 实例；看板展示与限次校验均从此读/写 used。
[[durable_objects.bindings]]
name = "KEY_COUNTER"
class_name = "ApiKeyCounter"

[[migrations]]
tag = "v1-key-counter"
new_classes = ["ApiKeyCounter"]

# Workers AI 绑定（模式 A：单账号，内部 RPC 调用）
[ai]
binding = "AI"
